[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard"
version = "1.0.0"
description = "Approve or block every MCP request Claude Desktop and Claude Web make, from a popup above your other windows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []   # standard library only (Tk ships with Python on Windows and macOS)

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[tool.setuptools.packages.find]
include = ["mcp_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
